<svg width="900" height="276" viewBox="0 0 900 276" xmlns="http://www.w3.org/2000/svg"><defs><style>text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace;}</style></defs><rect x="0.5" y="0.5" width="899" height="275" rx="12" ry="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="28" y="38" fill="#0969da" font-size="14.5" font-weight="700">$ query --systems --built</text><text x="28" y="65" fill="#1f2328" font-size="13.5">[ tax-compliance platform, ~59 microservices ]</text><text x="500" y="65" fill="#59636e" font-size="13.5">GCP . Java/Spring . Python . Vue.js  @ Elogia Tech</text><text x="28" y="92" fill="#1f2328" font-size="13.5">[ hotel management system ]</text><text x="500" y="92" fill="#59636e" font-size="13.5">Node.js . TypeScript . GCP  @ Tecnovedades Web</text><text x="28" y="119" fill="#1f2328" font-size="13.5">[ product inventory system ]</text><text x="500" y="119" fill="#59636e" font-size="13.5">Node.js . MongoDB . AWS Lambda  @ Tecnovedades Web</text><text x="28" y="146" fill="#1f2328" font-size="13.5">[ clinic &amp; appointments platform ]</text><text x="500" y="146" fill="#59636e" font-size="13.5">NestJS . RabbitMQ . MySQL/MongoDB  @ Casamarket</text><text x="28" y="173" fill="#1f2328" font-size="13.5">[ e-commerce platform ]</text><text x="500" y="173" fill="#59636e" font-size="13.5">Node.js . MySQL . JWT  @ Casamarket</text><text x="28" y="200" fill="#1f2328" font-size="13.5">[ academic matching platform, ML ]</text><text x="500" y="200" fill="#59636e" font-size="13.5">NestJS . DDD . MongoDB  — StudySync</text><text x="28" y="227" fill="#1f2328" font-size="13.5">[ educational empowerment platform ]</text><text x="500" y="227" fill="#59636e" font-size="13.5">Node.js . DDD . AWS EC2/NGINX  — personal</text></svg>